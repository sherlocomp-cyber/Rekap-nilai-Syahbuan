name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm install

      - name: Siapkan web (unduh library & font untuk mode offline)
        run: node scripts/prepare.mjs

      - name: Buat proyek Android
        run: |
          npx cap add android
          node scripts/after-add-android.mjs
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rekap-nilai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Terbitkan rilis (jika versi di package.json belum dirilis)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(node -p "require('./package.json').version")"
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "Rilis $VER sudah ada, dilewati."
            exit 0
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "Rekap-Nilai-${VER}.apk"
          gh release create "$VER" "Rekap-Nilai-${VER}.apk" \
            --target "$GITHUB_SHA" \
            --title "Rekap Nilai ${VER}" \
            --notes-file RELEASE_NOTES.md
