name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm install

      - name: Siapkan web (unduh library & font untuk mode offline)
        run: node scripts/prepare.mjs

      - name: Buat proyek Android
        run: |
          npx cap add android
          node scripts/after-add-android.mjs
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rekap-nilai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Terbitkan rilis (hanya saat ada tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Rekap-Nilai-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "Rekap-Nilai-${GITHUB_REF_NAME}.apk" \
            --title "Rekap Nilai ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
