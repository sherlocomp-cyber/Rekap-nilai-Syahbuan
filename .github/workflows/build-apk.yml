name: Build APK & Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rekap-nilai-release
  cancel-in-progress: false

jobs:
  apk:
    name: Build APK & Rilis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm install

      - name: Siapkan web (unduh library & font untuk mode offline)
        run: node scripts/prepare.mjs

      - name: Buat proyek Android
        run: |
          npx cap add android
          node scripts/after-add-android.mjs
          npx cap sync android

      - name: Pasang keystore tetap (agar APK baru bisa menimpa yang lama)
        run: |
          mkdir -p ~/.android
          base64 -d signing/debug.keystore.b64 > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rekap-nilai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Terbitkan rilis baru (otomatis di setiap update)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")"
          VER="v${BASE}.${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "Rekap-Nilai-${VER}.apk"
          {
            echo "Perubahan:"
            git log -1 --pretty=%B
            echo
            if [ -f RELEASE_NOTES.md ]; then cat RELEASE_NOTES.md; fi
          } > notes.md
          gh release create "$VER" "Rekap-Nilai-${VER}.apk" \
            --target "$GITHUB_SHA" \
            --title "Rekap Nilai ${VER}" \
            --notes-file notes.md

  pages:
    name: Deploy ke GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Unggah versi web (src/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: src

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
