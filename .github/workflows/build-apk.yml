name: Build APK & Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rekap-nilai-release
  cancel-in-progress: false

jobs:
  apk:
    name: Build APK & Rilis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm install

      - name: Tentukan versi (nomor run = versionCode Android)
        run: |
          BASE="$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")"
          echo "VER=v${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VNAME=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Siapkan web (unduh library & font untuk mode offline)
        run: node scripts/prepare.mjs

      - name: Buat proyek Android (ikon, kunci tanda tangan tetap, dll.)
        run: |
          npx cap add android
          node scripts/after-add-android.mjs
          npx cap sync android

      - name: Set versionCode & versionName
        run: |
          sed -i "s/versionCode [0-9]\+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${VNAME}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          grep -q "versionCode ${GITHUB_RUN_NUMBER}" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rekap-nilai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Terbitkan rilis baru
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" "Rekap-Nilai-${VER}.apk"
          cp "$APK" "Rekap-Nilai.apk"
          {
            echo "Perubahan:"
            git log -1 --pretty=%B
            echo
            if [ -f RELEASE_NOTES.md ]; then cat RELEASE_NOTES.md; fi
          } > notes.md
          gh release create "$VER" "Rekap-Nilai-${VER}.apk" "Rekap-Nilai.apk" \
            --target "$GITHUB_SHA" \
            --title "Rekap Nilai ${VER}" \
            --notes-file notes.md

      - name: Hapus rilis lama (simpan 10 terbaru)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[10:] | .[].tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag --yes

  pages:
    name: Deploy ke GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Unggah versi web (src/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: src

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
