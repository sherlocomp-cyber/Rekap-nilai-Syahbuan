name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Susun folder
        run: |
          mkdir -p src scripts signing resources/android
          mv index.html src/index.html
          mv prepare.mjs android-shim.js after-add-android.mjs scripts/
          mv debug.keystore signing/debug.keystore
          mv icon.png resources/android/icon.png

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install
      - run: node scripts/prepare.mjs
      - run: npx cap add android
      - run: node scripts/after-add-android.mjs
      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rekap-nilai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
